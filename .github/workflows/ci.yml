name: CI

# プルリクエストと main への push で、lint / 型チェック / テスト / ビルドを検証する。
# デプロイは deploy.yml が担当する (責務を分けておくと、
# 「テストは通したいがデプロイはしたくない」ケースに対応しやすい)。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同じブランチで新しい push があったら古い実行はキャンセルする (無駄な課金を避ける)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      - name: ユニットテスト
        run: npm test

      # Security Rules のテストは Firebase Emulator (Java) が必要
      - name: Java のセットアップ (Firestore Emulator 用)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Security Rules テスト
        run: npm run test:rules

      - name: ビルド
        run: npm run build
